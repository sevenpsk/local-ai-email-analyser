services:
  email-analyser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-email-analyser
    ports:
      - "3001:3001"
    volumes:
      # Persist the local email database folder so your emails are kept safe between container restarts
      - ./data:/app/data
      # Mount the configuration file from your host machine so you can edit credentials easily
      - ./config.json:/app/config.json
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    # Bridge host network access to allow the container to securely query host services like Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
